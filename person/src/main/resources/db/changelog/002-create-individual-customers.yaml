databaseChangeLog:

  - changeSet:
      id: 002-create-individual-customers
      author: finstream

      changes:

        - createTable:
            tableName: individual_customers
            columns:

              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)

              - column:
                  name: middle_name
                  type: VARCHAR(255)

              - column:
                  name: last_name
                  type: VARCHAR(255)

              - column:
                  name: national_id
                  type: VARCHAR(255)

              - column:
                  name: date_of_birth
                  type: DATE

              - column:
                  name: nationality
                  type: VARCHAR(255)

              - column:
                  name: gender
                  type: VARCHAR(255)

              - column:
                  name: occupation
                  type: VARCHAR(255)

              - column:
                  name: employer_name
                  type: VARCHAR(255)

        - addForeignKeyConstraint:
            baseTableName: individual_customers
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: customer_id
            constraintName: fk_individual_customer_customer